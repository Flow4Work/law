<!doctype html><html lang="ko"><meta charset="utf-8"><title>정렬·카드 문구 QA</title><body><h1>정렬·카드 문구 격리 QA</h1><button id="install">카드 문구 사례 열기</button><button id="clean">QA 기록 정리</button><p id="status"></p><script>
const key='ai-legal-roadmap-cases-v1',active='ai-legal-roadmap-active-v1',id='qa-alignment-copy-20261027';
const make=(id,title,description,extra={})=>({id,title,description,status:'possible',kind:'route',conditions:[],actions:[],documents:[],cost:'',duration:'',risks:[],sourceIds:[],next:[],...extra});
const methods=[make('qa-property','재산명시·재산명시 신청','법원에 재산 목록 제출을 신청해요. 채무자가 자기 재산을 밝히게 해요. 찾은 재산은 따로 압류해야 해요.'),make('qa-seizure','다른 재산 압류 진행','급여·부동산·자동차 등 채무자의 다른 재산에 대해 압류를 신청하는 경로예요.'),make('qa-labor','노동청에 퇴직금 체불 진정하기','밀린 임금·퇴직금을 신고해요. 노동청이 조사하고 지급을 요구해요. 신고만으로 돈이 회수되진 않아요.'),make('qa-consult','집행 수단 정리하고 상담받기','1. 집행 기록·재산 단서 정리 2. 법률구조공단 등 상담 3. 가능한 수단 골라 실행')];
methods.forEach(n=>n.scenario={suitableWhen:'',steps:[{title:'준비 내용 확인',description:'진행하기 전에 필요한 내용을 정리해요.'},{title:'신청 내용 작성',description:'상황에 맞는 신청 내용을 작성해요.'},{title:'신청 뒤 대응',description:'진행 상황에 맞춰 다음 대응을 살펴봐요.'}],outcomes:[{title:'대응 후 확인',description:'실제로 달라진 내용을 확인해요.'},{title:'다음 방법 비교',description:'필요하면 다른 대응을 살펴봐요.'}],transitions:[]});
const root=make('qa-now','계좌 압류 실패 후 다음 수단 정리','승소 판결 등이 있지만 계좌 압류로 돈을 받지 못했어요. 다른 재산에서 받을 방법을 살펴보는 상황이에요.',{kind:'situation',status:'current',next:methods.map(n=>n.id)});
document.querySelector('#install').onclick=()=>{if(location.hostname!=='127.0.0.1')throw Error('격리 주소만 허용');const cases=JSON.parse(localStorage.getItem(key)||'[]');const value={id,name:'QA 정렬과 문구',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[],nodes:[root,...methods],edges:methods.map(n=>({source:root.id,target:n.id})),facts:[],sources:[],evidenceStatus:'unverified',analysisVersion:3};localStorage.setItem(key,JSON.stringify([...cases.filter(c=>c.id!==id),value]));localStorage.setItem(active,id);location.href='/'};
document.querySelector('#clean').onclick=()=>{localStorage.setItem(key,JSON.stringify(JSON.parse(localStorage.getItem(key)||'[]').filter(c=>c.id!==id)));if(localStorage.getItem(active)===id)localStorage.removeItem(active);document.querySelector('#status').textContent='QA 기록만 정리했습니다.'};
</script></body></html>
